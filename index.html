<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Lecteur CD Audio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-container">
        <h1>Lecteur CD Audio</h1>
        <div class="display">
            <p id="track-info">Insérez un CD audio</p>
        </div>
        <div class="controls">
            <button id="btn-prev">⏮</button>
            <button id="btn-play">▶ Lecture</button>
            <button id="btn-pause">⏸ Pause</button>
            <button id="btn-stop">⏹ Stop</button>
            <button id="btn-next">⏭</button>
            <button id="btn-eject">⏏ Éjecter</button>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
