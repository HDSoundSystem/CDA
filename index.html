<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CD Audio Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="player-container">

    <div class="header">
      <h1>CD Audio Player</h1>
      <div class="drive-row">
        <label for="drive-select">Drive</label>
        <select id="drive-select">
          <option>C:</option>
          <option>D:</option>
          <option>E:</option>
          <option selected>F:</option>
          <option>G:</option>
          <option>H:</option>
        </select>
      </div>
    </div>

    <div class="meta-panel" id="meta-panel">
      <div class="meta-artist" id="meta-artist"></div>
      <div class="meta-album"  id="meta-album"></div>
    </div>

    <div class="display">
      <div class="track-info">
        <span class="label">Track</span>
        <span id="track-num">--</span>
        <span class="sep">/</span>
        <span id="track-total">--</span>
        <span class="track-title" id="track-title"></span>
      </div>
      <div class="time-info">
        <span id="time-elapsed">0:00</span>
        <span class="time-sep"> / </span>
        <span id="time-total">0:00</span>
      </div>
      <div id="status-text">Insert a CD</div>
    </div>

    <div class="tracklist-container">
      <ul id="tracklist"></ul>
    </div>

    <div class="controls">
      <button id="btn-prev"  title="Previous track"><i class="fa-solid fa-backward-step"></i></button>
      <button id="btn-play"  title="Play"><i class="fa-solid fa-play"></i></button>
      <button id="btn-pause" title="Pause"><i class="fa-solid fa-pause"></i></button>
      <button id="btn-stop"  title="Stop"><i class="fa-solid fa-stop"></i></button>
      <button id="btn-next"  title="Next track"><i class="fa-solid fa-forward-step"></i></button>
      <button id="btn-eject" title="Eject"><i class="fa-solid fa-eject"></i></button>
    </div>

    <div class="volume-row">
      <i class="fa-solid fa-volume-low"></i>
      <input type="range" id="volume-slider" min="0" max="100" value="80">
      <i class="fa-solid fa-volume-high"></i>
      <span id="volume-value">80%</span>
    </div>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
